name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # AppVeyor's last build was 35; Actions run 1 continues at 36.
  CI_BUILD_NUMBER_OFFSET: 35

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set CI version
        run: |
          [xml]$project = Get-Content Crapto1Sharp/Crapto1Sharp.csproj
          $baseVersion = [string]$project.Project.PropertyGroup.Version
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a three-part project version, got '$baseVersion'."
          }
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER + [int]$env:CI_BUILD_NUMBER_OFFSET
          $version = "$baseVersion.$buildNumber"
          "CI_VERSION=$version" >> $env:GITHUB_ENV
          "CI package version: $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore
        run: dotnet restore Crapto1Sharp.slnx

      - name: Build all target frameworks and package
        run: >-
          dotnet build Crapto1Sharp.slnx --configuration Release --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:Version=$env:CI_VERSION
          -p:PackageVersion=$env:CI_VERSION
          -p:AssemblyVersion=$env:CI_VERSION
          -p:FileVersion=$env:CI_VERSION
          -p:InformationalVersion=$env:CI_VERSION

      - name: Test .NET 10 and .NET Framework 4.6.2
        run: >-
          dotnet test Crapto1Sharp.Test/Crapto1Sharp.Test.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFilePrefix=tests" --results-directory TestResults

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Upload NuGet package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-${{ env.CI_VERSION }}-${{ github.run_attempt }}
          path: Crapto1Sharp/bin/Release/*.nupkg
          if-no-files-found: error
          retention-days: 30

